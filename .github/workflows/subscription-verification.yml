name: Recover pending Reoon verifications

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: subscription-reoon-recovery
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify pending subscriptions and resume unfinished bulk tasks
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          REOON_API_KEY: ${{ secrets.REOON_API_KEY }}
        run: node scripts/recover-verifications.mjs
