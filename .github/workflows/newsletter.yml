name: WatchDive newsletter scheduling and delivery report
on:
  schedule:
    - cron: '0 1 * * *' # Daily 10:00 Asia/Seoul; GitHub may delay scheduled runs
  workflow_dispatch:
    inputs:
      mode:
        description: Apply the existing queue or inspect account usage only
        type: choice
        options: [apply, preview, usage]
        default: apply
permissions:
  contents: read
concurrency:
  group: watchdive-newsletter
  cancel-in-progress: false
jobs:
  newsletter:
    if: vars.NEWSLETTER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          if [ "$NEWSLETTER_MODE" = "usage" ]; then
            node scripts/newsletter-tick.mjs --usage-only
          elif [ "$NEWSLETTER_MODE" = "preview" ]; then
            node scripts/newsletter-daily.mjs
          else
            node scripts/newsletter-daily.mjs --apply
          fi
        env:
          NEWSLETTER_ENABLED: 'true'
          NEWSLETTER_MODE: ${{ inputs.mode || 'apply' }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NEWSLETTER_RESEND_API_KEY: ${{ secrets.NEWSLETTER_RESEND_API_KEY }}
          NEWSLETTER_TOKEN_SECRET: ${{ secrets.NEWSLETTER_TOKEN_SECRET }}
