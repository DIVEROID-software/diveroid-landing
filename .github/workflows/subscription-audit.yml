name: Audit subscription storage
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Encrypt existing runtime credentials for office scheduler
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NEWSLETTER_TOKEN_SECRET: ${{ secrets.NEWSLETTER_TOKEN_SECRET }}
        run: node scripts/season2-runtime-handoff.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: season2-runtime-encrypted
          path: runtime-handoff/encrypted.json
          retention-days: 1
