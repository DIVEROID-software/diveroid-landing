name: Deploy to Vercel (Production)

# main에 push되면 자동으로 www.diveroid.com 프로덕션 배포
# 필요 Secrets (repo Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN      — Vercel 계정 토큰 (vercel.com/account/tokens)
#   VERCEL_ORG_ID     — team_3zjUp9UuLY1tzb2g4XQ1scwt
#   VERCEL_PROJECT_ID — prj_7ZvbKAi1It5CuEg3kqKfbUrx23JT

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Verify subscription storage behavior
        run: node --test test/*.test.mjs
      - name: Configure automatic verification
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          REOON_API_KEY: ${{ secrets.REOON_API_KEY }}
        run: node scripts/configure-reoon.mjs
      - name: Configure newsletter delivery and tracking
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          NEWSLETTER_RESEND_API_KEY: ${{ secrets.NEWSLETTER_RESEND_API_KEY }}
          NEWSLETTER_TOKEN_SECRET: ${{ secrets.NEWSLETTER_TOKEN_SECRET }}
          NEWSLETTER_WEBHOOK_SECRET: ${{ secrets.NEWSLETTER_WEBHOOK_SECRET }}
        run: node scripts/configure-newsletter.mjs
      - name: Install Vercel CLI
        run: npm install -g vercel@latest
      - name: Deploy (production)
        run: vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
      - name: Verify deployed function starts and accepts browser preflight
        run: |
          node --input-type=module <<'JS'
          const url = 'https://diveroid-landing.vercel.app/api/subscribe';
          for (const [method, status] of [['GET', 405], ['OPTIONS', 200]]) {
            let ready = false, lastStatus;
            // The production alias can briefly reach the previous deployment.
            for (let attempt = 0; attempt < 6; attempt++) {
              const res = await fetch(`${url}?runtime-check=${Date.now()}`, { method, signal: AbortSignal.timeout(15000) });
              lastStatus = res.status;
              if (res.status === status && res.headers.get('access-control-allow-origin') === '*') { ready = true; break; }
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            if (!ready) throw new Error(`Subscription runtime check failed: ${method} ${lastStatus}`);
          }
          console.log('Subscription runtime and CORS verified without creating a signup.');
          JS
